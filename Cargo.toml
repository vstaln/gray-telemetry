[package]
name = "gray-telemetry"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Merged telemetry plugin for the gray agent harness: observe, stamp, usage in one sidecar."

[[bin]]
name = "telemetry"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
